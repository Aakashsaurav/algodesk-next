[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "algodesk"
version = "0.0.0"
description = "Pluggable trading workbench for Indian markets."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2",
    "typer>=0.9",
    "httpx>=0.27",
    "websockets>=13",
    "protobuf>=5",
    "yfinance>=0.2",
    "pyarrow>=17",
]

[project.scripts]
algodesk = "algodesk.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "import-linter",
    "pip-audit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/algodesk"]

[tool.ruff]
line-length = 100
src = ["src"]
exclude = [
    ".agents",
    "_workbench",
    "plugins/brokers/upstox/proto",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
strict = true
exclude = [
    "^plugins/brokers/upstox/proto/.*$",
]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]
markers = [
    "live: tests requiring live network access (disallowed in offline test runs)",
]

[tool.uv]
python-preference = "only-managed"
python-downloads = "manual"


