# OMS and Portfolio parameters

[[param]]
name = "oms.submit_timeout_ms"
type = "int"
default = 5000
min = 100
max = 60000
unit = "ms"
scope = "global"
tighten = "down"
description = "Timeout in milliseconds waiting for venue order acknowledgment before moving to UNKNOWN/RECONCILING"
owner = "oms"

[[param]]
name = "portfolio.snapshot_seconds"
type = "int"
default = 60
min = 1
max = 3600
unit = "s"
scope = "global"
tighten = "down"
description = "Interval in seconds between periodic portfolio snapshot journal entries"
owner = "portfolio"
