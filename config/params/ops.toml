# Operational power, sleep prevention, and process suspension detection parameters

[[param]]
name = "ops.keep_awake"
type = "bool"
default = true
scope = "global"
tighten = "none"
description = "Automatically spawn caffeinate -i -w <pid> during paper/live runs on macOS"
owner = "ops"

[[param]]
name = "ops.min_battery_pct"
type = "int"
default = 50
min = 0
max = 100
unit = "%"
scope = "global"
tighten = "up"
description = "Minimum battery percentage required on macOS before ops.power reports critical"
owner = "ops"

[[param]]
name = "ops.require_ac"
type = "bool"
default = false
scope = "global"
tighten = "none"
description = "Require AC power for paper/live runs on macOS (critical if on battery)"
owner = "ops"

[[param]]
name = "engine.suspend_detect_seconds"
type = "int"
default = 30
min = 1
max = 3600
unit = "s"
scope = "global"
tighten = "down"
description = "Wall-vs-monotonic clock jump threshold in seconds to detect process suspension"
owner = "engine"
