# Parameters for backtest reporting, performance metrics, and trial evaluation

[[param]]
name = "report.trading_days_per_year"
type = "int"
default = 252
min = 1
max = 366
scope = "global"
tighten = "none"
description = "Number of trading days per year used for annualizing return, volatility, and ratios"
owner = "results"

[[param]]
name = "report.risk_free_rate_pct"
type = "float"
default = 0.0
min = 0.0
max = 100.0
scope = "global"
tighten = "none"
description = "Annualized risk-free rate percentage used for Sharpe and Sortino ratios"
owner = "results"

[[param]]
name = "report.min_trades"
type = "int"
default = 30
min = 0
max = 100000
scope = "global"
tighten = "none"
description = "Minimum closed round trips before performance statistics are considered statistically meaningful"
owner = "results"
