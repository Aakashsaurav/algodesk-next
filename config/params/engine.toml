# Engine parameters for bar builder, scheduling, and session lifecycle

[[param]]
name = "engine.bar_close_grace_ms"
type = "int"
default = 500
min = 0
max = 10000
unit = "ms"
scope = "global"
tighten = "down"
description = "Grace period in milliseconds before boundary timer closes incomplete bar"
owner = "engine"

[[param]]
name = "engine.fill_empty_bars"
type = "bool"
default = true
scope = "global"
tighten = "none"
description = "Whether to synthesize flat bars for empty periods after first session tick"
owner = "engine"

[[param]]
name = "engine.scheduler_tolerance_ms"
type = "int"
default = 50
min = 1
max = 5000
unit = "ms"
scope = "global"
tighten = "down"
description = "Tolerance in milliseconds for scheduler timer dispatch"
owner = "engine"

[[param]]
name = "engine.session_end_grace_s"
type = "int"
default = 0
min = 0
max = 3600
unit = "s"
scope = "global"
tighten = "down"
description = "Grace period in seconds after market close before transitioning market to CLOSING"
owner = "engine"

[[param]]
name = "feed.stale_seconds"
type = "float"
default = 30.0
min = 1.0
max = 3600.0
unit = "s"
scope = "global"
tighten = "down"
description = "Seconds without ticks during open market hours before flagging feed gap and reconnecting"
owner = "engine"

[[param]]
name = "run.status_seconds"
type = "int"
default = 30
min = 1
max = 3600
unit = "s"
scope = "global"
tighten = "down"
description = "Interval in seconds between console status line updates during session execution"
owner = "engine"

[[param]]
name = "run.stats_seconds"
type = "int"
default = 60
min = 1
max = 3600
unit = "s"
scope = "global"
tighten = "down"
description = "Interval in seconds between periodic tick, bar and proc stats emission"
owner = "engine"

[[param]]
name = "engine.feed_poll_timeout_ms"
type = "int"
default = 100
min = 1
max = 5000
unit = "ms"
scope = "global"
tighten = "down"
description = "Timeout in milliseconds for polling market event queue during live session execution"
owner = "engine"

