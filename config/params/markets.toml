# config/params/markets.toml — Market sessions, operating hours, and exchange schedules

# --- NSE Equity (nse.eq) ---

[[param]]
name = "market.nse.eq.preopen.open"
type = "time"
default = "09:00"
tighten = "none"
description = "NSE equity pre-open session start time. Verified (PRD)."
owner = "core"

[[param]]
name = "market.nse.eq.preopen.close"
type = "time"
default = "09:15"
tighten = "none"
description = "NSE equity pre-open session end time. Verified (PRD)."
owner = "core"

[[param]]
name = "market.nse.eq.regular.open"
type = "time"
default = "09:15"
tighten = "none"
description = "NSE equity regular trading session start time. Verified (PRD)."
owner = "core"

[[param]]
name = "market.nse.eq.regular.close"
type = "time"
default = "15:30"
tighten = "none"
description = "NSE equity regular trading session end time. Verified (PRD)."
owner = "core"

[[param]]
name = "market.nse.eq.weekdays"
type = "str"
default = "MON,TUE,WED,THU,FRI"
tighten = "none"
description = "NSE equity trading weekdays. Verified (PRD)."
owner = "core"

[[param]]
name = "market.nse.eq.timezone"
type = "str"
default = "Asia/Kolkata"
tighten = "none"
description = "NSE equity market timezone. Verified (PRD)."
owner = "core"

[[param]]
name = "market.nse.eq.squareoff"
type = "time"
default = "15:15"
tighten = "none"
description = "NSE equity intraday square-off time. Verified (PRD)."
owner = "core"

