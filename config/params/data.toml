# Data recorder, compaction, catalog, and retention parameters

[[param]]
name = "recorder.flush_seconds"
type = "int"
default = 60
min = 5
max = 600
unit = "s"
scope = "global"
tighten = "down"
description = "Interval in seconds between buffered market tick flushes to parquet part files"
owner = "data"

[[param]]
name = "recorder.max_buffer_rows"
type = "int"
default = 5000
min = 100
max = 500000
unit = "rows"
scope = "global"
tighten = "down"
description = "Maximum in-memory buffer row count before flushing a part file"
owner = "data"

[[param]]
name = "data.trash_days"
type = "int"
default = 7
min = 1
max = 365
unit = "days"
scope = "global"
tighten = "down"
description = "Retention period in days for files in the data trash before purging"
owner = "data"

[[param]]
name = "data.compact_on_close"
type = "bool"
default = true
scope = "global"
tighten = "none"
description = "Whether to automatically compact part files into day.parquet at session close"
owner = "data"

[[param]]
name = "recorder.min_free_disk_gb"
type = "int"
default = 5
min = 1
max = 1000
unit = "GB"
scope = "global"
tighten = "down"
description = "Minimum free disk space in gigabytes required before halting recording"
owner = "data"

[[param]]
name = "recorder.max_disk_fraction"
type = "float"
default = 0.5
min = 0.01
max = 1.0
unit = "ratio"
scope = "global"
tighten = "down"
description = "Maximum fraction of free disk that projected 10 days of recorded ticks may occupy before doctor warns"
owner = "data"

[[param]]
name = "data.base_timeframes"
type = "str"
default = "1m,1d"
scope = "global"
tighten = "none"
description = "Base candlestick bar timeframes permitted in historical bar store (comma-separated)"
owner = "data"

[[param]]
name = "data.settle_minutes"
type = "int"
default = 15
min = 0
max = 1440
unit = "min"
scope = "global"
tighten = "down"
description = "Settlement minutes margin after session close before marking day COMPLETE"
owner = "data"

[[param]]
name = "data.quarantine_days"
type = "int"
default = 3
min = 1
max = 365
unit = "days"
scope = "global"
tighten = "down"
description = "Retention period in days for quarantined market data before purge"
owner = "data"

[[param]]
name = "data.session_bars_keep_days"
type = "int"
default = 1
min = 1
max = 365
unit = "days"
scope = "global"
tighten = "down"
description = "Retention period in days for intraday live session bars before purge"
owner = "data"

[[param]]
name = "data.price_jump_pct"
type = "float"
default = 20.0
min = 0.1
max = 1000.0
unit = "%"
scope = "global"
tighten = "down"
description = "Price jump threshold percentage between consecutive bars for warning flag"
owner = "data"



[[param]]
name = "data.fetch_chunk_days"
type = "int"
default = 30
min = 1
max = 365
unit = "days"
scope = "global"
tighten = "down"
description = "Maximum chunk span in days per historical data fetch request"
owner = "data"

[[param]]
name = "data.fetch_max_workers"
type = "int"
default = 4
min = 1
max = 32
unit = "workers"
scope = "global"
tighten = "down"
description = "Maximum concurrent worker threads for parallel historical data fetching"
owner = "data"

[[param]]
name = "data.fetch_retries"
type = "int"
default = 3
min = 0
max = 10
unit = "retries"
scope = "global"
tighten = "down"
description = "Maximum retries before marking an unreached historical data chunk as EMPTY"
owner = "data"

[[param]]
name = "data.rate_backoff_base_s"
type = "float"
default = 1.0
min = 0.1
max = 60.0
unit = "s"
scope = "global"
tighten = "up"
description = "Initial exponential backoff base delay in seconds upon rate limit or 429 error"
owner = "data"

[[param]]
name = "data.rate_backoff_jitter_s"
type = "float"
default = 0.5
min = 0.0
max = 10.0
unit = "s"
scope = "global"
tighten = "none"
description = "Random jitter in seconds added to rate limit backoff delay"
owner = "data"

[[param]]
name = "data.warmup_source"
type = "str"
default = "upstox"
scope = "global"
tighten = "none"
description = "Default market data source plugin name used for pre-session warm-up"
owner = "data"

[[param]]
name = "data.actions_ttl_hours"
type = "int"
default = 24
min = 1
max = 720
unit = "hours"
scope = "global"
tighten = "down"
description = "TTL in hours for corporate actions cache before refresh is required"
owner = "data"

[[param]]
name = "corp.dividend_tolerance_pct"
type = "float"
default = 1.0
min = 0.0
max = 100.0
unit = "%"
scope = "global"
tighten = "down"
description = "Tolerance percentage for confirming dividend amounts between sources"
owner = "data"

[[param]]
name = "corp.allow_unverified_dividends"
type = "bool"
default = true
scope = "global"
tighten = "none"
description = "Allow unverified dividends during adjustment view with warning in provenance"
owner = "data"

[[param]]
name = "data.drop_flat_zero_volume_bars"
type = "bool"
default = true
scope = "global"
tighten = "none"
description = "Drop flat bars with zero volume and open=high=low=close on expected trading days"
owner = "data"

[[param]]
name = "corp.primary_source"
type = "str"
default = "upstox"
scope = "global"
tighten = "none"
description = "Primary data source used to choose values when corporate actions are confirmed across sources"
owner = "data"

[[param]]
name = "corp.detect_jump_pct"
type = "float"
default = 20.0
min = 0.1
max = 1000.0
unit = "%"
scope = "global"
tighten = "down"
description = "Price jump percentage threshold on raw 1d bars to suspect corporate action"
owner = "data"

[[param]]
name = "corp.audit_tolerance_pct"
type = "float"
default = 0.5
min = 0.01
max = 10.0
unit = "%"
scope = "global"
tighten = "down"
description = "Audit tolerance percentage comparing derived adjusted series with source-adjusted series"
owner = "data"

[[param]]
name = "data.closure_sample"
type = "str"
default = "NSE:EQ:RELIANCE,NSE:EQ:TCS,NSE:EQ:INFY,NSE:EQ:HDFCBANK,NSE:EQ:ICICIBANK"
scope = "global"
tighten = "none"
description = "Default sample of liquid instruments used to infer market closures"
owner = "data"

[[param]]
name = "data.closure_min_symbols"
type = "int"
default = 3
min = 1
max = 10
unit = "symbols"
scope = "global"
tighten = "down"
description = "Minimum number of symbols reporting bars on a non-trading day to infer a special trading session"
owner = "data"
