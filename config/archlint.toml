# config/archlint.toml — AST linting rules and patterns for AlgoDesk Next

[banned_calls]
banned_functions = ["eval", "exec", "os.system"]
ban_shell_true = true

[stub_detector]
allowed_docstring_exceptions = true
pass_or_ellipsis = true
return_true_prefixes = ["check", "is_", "is", "verify", "ping"]

[hard_coded_limits]
patterns = ["limit", "max_", "min_", "threshold", "timeout", "buffer", "retries", "ttl", "interval", "cap"]
ignore_values = [0, 1, -1, 0.0, 1.0, -1.0]

[plugin_imports]
allowed_framework_roots = ["algodesk.api"]

[exclusions]
directories = [".agents", "_workbench", "__pycache__", "proto", "graphify-out"]

[direct_clock]
banned_symbols = ["datetime.now", "datetime.utcnow", "time.time"]
enforced_prefixes = [
    "src/algodesk/engine",
    "src/algodesk/oms",
    "src/algodesk/risk",
    "src/algodesk/portfolio",
    "src/algodesk/results",
    "src/algodesk/strategies",
    "plugins/strategies",
]
exempt_files = ["src/algodesk/engine/clock.py"]
