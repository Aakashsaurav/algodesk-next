# config/secretscan.toml — secret scanner patterns and ignore rules

[patterns]
private_key = '-----BEGIN (?:[A-Z0-9_-]+ )?PRIVATE KEY-----'
cloud_access_key = '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
github_token = '\b(?:(?:ghp|gho|ghu|ghs|ghr)_[0-9a-zA-Z]{36}|github_pat_[0-9a-zA-Z_]{22,})\b'
telegram_token = '\b\d{8,10}:[a-zA-Z0-9_-]{35}\b'
quoted_secret_regex = '(?i)\b(token|secret|password|passwd|api_key|apikey|credential)\b\s*[:=]\s*["\']([^"\']{16,})["\']'

[placeholders]
keywords = [
    "placeholder",
    "example",
    "dummy",
    "sample",
    "changeme",
    "your_",
    "default",
    "xxxx",
    "<",
    ">",
    "env:",
    "secret:",
    "my_secret",
    "fake-secret",
    "test_token",
]

[exclusions]
directories = [
    ".git",
    ".venv",
    ".local",
    "data",
    "logs",
    "results",
    "_workbench",
    "__pycache__",
]
file_patterns = [
    "*.lock",
    "uv.lock",
    "poetry.lock",
    "package-lock.json",
    "Cargo.lock",
]
