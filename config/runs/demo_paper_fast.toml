# config/runs/demo_paper_fast.toml — Acceptance-only fast paper/replay run configuration
# Uses 1m timeframe and small SMA windows (fast 3, slow 8) to trigger crosses rapidly.

allocated_capital = 100000

[run]
name = "demo_paper_fast"
mode = "paper"

[data_source]
plugin = "upstox"
auth_priority = ["analytics", "oauth"]

[execution_venue]
plugin = "sim"
seed = 7

[fees]
schedule = "zerodha_nse"

[[calendars]]
plugin = "exchange"
exchange = "nse"

[secrets]
plugin = "keychain"

[universe]
symbols = [
    "NSE:EQ:RELIANCE",
    "NSE:EQ:TCS",
    "NSE:EQ:HDFCBANK",
    "NSE:EQ:INFY",
    "NSE:EQ:ICICIBANK",
    "MCX:FNO:GOLD FUT 04 DEC 26",
]

[[strategies]]
plugin = "sma_cross"
risk_profile = "conservative"
params = { timeframe = "1m", fast = 3, slow = 8, qty = 1, exit_time = "21:15" }

[[notifiers]]
plugin = "telegram"

