name = "keychain"
kind = "secrets"
version = "0.1.0"
api_version = 1
entry = "plugin:KeychainSecretsPlugin"
config_schema = "config_schema:KeychainSecretsConfig"
modes_allowed = ["research", "backtest", "paper", "live"]
order_capable = false
verified_on = "2026-10-23"
sources = ["Apple macOS Keychain Services /usr/bin/security documentation"]

[capabilities]
keychain = true
read = true
write = true
delete = true

[requires]
packages = ["pydantic", "pytest"]
